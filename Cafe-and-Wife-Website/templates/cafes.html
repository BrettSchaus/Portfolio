<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cafes</title>
</head>
<body>

<h1>All Cafes</h1>

{% for cafe in cafes %}
    <h2>{{ cafe.name }}</h2>
    <p>Location: {{ cafe.location }}</p>
    <p>WiFi: {{ cafe.has_wifi }}</p>
    <p>Power sockets: {{ cafe.sockets }}</p>
    <hr>
{% endfor %}

</body>
</html>
